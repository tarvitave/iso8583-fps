[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iso8583-fps"
version = "0.1.0"
description = "A small, dependency-free ISO 8583 codec with a UK Faster Payments profile (ASCII + BCD/binary)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KibiPay" }]
keywords = ["iso8583", "iso-8583", "faster-payments", "fps", "payments", "bcd", "bitmap", "codec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://kibipay.com"
Source = "https://github.com/tarvitave/iso8583-fps"

[tool.setuptools]
py-modules = ["iso8583_fps"]
