name: Publish to PyPI

# Manual, explicit publish. Run from the Actions tab (or: gh workflow run publish.yml)
# AFTER configuring a Trusted Publisher on PyPI (see PUBLISHING.md). No API tokens
# are stored — PyPI verifies this workflow's OIDC identity.
on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
